services:
  db:
    image: postgres:16-alpine
    container_name: repair-cafe-telemetry-db
    restart: unless-stopped
    # Default bridge network: the host's predefined address pools are already
    # exhausted, which is why the hub does the same.
    network_mode: bridge
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      TZ: "${TZ:-Europe/London}"
    volumes:
      - telemetry-db:/var/lib/postgresql/data
    # Reachable from the app container only, never from the host.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: repair-cafe-telemetry:latest
    container_name: repair-cafe-telemetry
    restart: unless-stopped
    network_mode: bridge
    # Host 5040 → container 3000. Bound to loopback because nginx on this box
    # is what faces the internet, exactly like the hub on 5026.
    ports:
      - "127.0.0.1:5040:3000"
    links:
      - db
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: "${TZ:-Europe/London}"
      DATABASE_URL: "postgresql://telemetry:${DB_PASSWORD}@db:5432/telemetry"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # nginx and Cloudflare sit in front, so the client address arrives in a
      # header rather than on the socket.
      TRUST_PROXY: "true"
      DIRECTORY_CACHE: /data/repair-cafe-directory.json
    volumes:
      # Holds the daily copy of the public repaircafe.org directory. Losing it
      # costs one refetch, nothing more.
      - telemetry-cache:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  telemetry-db:
    name: repair-cafe-telemetry-db
  telemetry-cache:
    name: repair-cafe-telemetry-cache
