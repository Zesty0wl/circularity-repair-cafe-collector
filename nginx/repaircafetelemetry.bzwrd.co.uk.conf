# Circularity Repair Cafe Hub — telemetry collector
#
#   Cloudflare (proxied DNS)
#     → nostromo:443
#     → this vhost
#     → http://127.0.0.1:5040  (repair-cafe-telemetry container)
#
# Install:
#   sudo cp nginx/repaircafetelemetry.bzwrd.co.uk.conf \
#           /etc/nginx/sites-available/repaircafetelemetry.bzwrd.co.uk
#   sudo ln -s /etc/nginx/sites-available/repaircafetelemetry.bzwrd.co.uk \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS: one proxied A record for repaircafetelemetry.bzwrd.co.uk pointing at
# this host. The certificate below is the existing Cloudflare origin
# certificate for *.bzwrd.co.uk, already on this box.

server {
    listen 80;
    listen [::]:80;
    server_name repaircafetelemetry.bzwrd.co.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name repaircafetelemetry.bzwrd.co.uk;

    ssl_certificate     /etc/ssl/certs/cloudflare/cloudflare_bzwrd.pem;
    ssl_certificate_key /etc/ssl/certs/cloudflare/cloudflare_bzwrd.key;

    # A ping is a couple of kilobytes. The app rejects anything over 64 KB
    # itself; this stops a big body reaching it at all.
    client_max_body_size 128k;

    access_log /var/log/nginx/repaircafetelemetry.access.log;
    error_log  /var/log/nginx/repaircafetelemetry.error.log;

    location / {
        proxy_pass http://127.0.0.1:5040;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cloudflare tells us the country, which saves us ever storing an
        # address to work out where an install is.
        proxy_set_header CF-IPCountry      $http_cf_ipcountry;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
